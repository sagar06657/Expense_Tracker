<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - Expense Tracker</title>
        <!-- Tailwind CSS CDN (for quick prototyping) -->
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            /* Small helper to limit form width on very large screens */
            .max-w-form { max-width: 420px; }
        </style>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-form bg-white rounded-xl shadow-md p-8">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Sign in to your account</h2>

        {% if error %}
        <p class="text-red-600 text-sm mb-4 text-center">{{ error }}</p>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="username" class="sr-only">Username</label>
                <input id="username" name="username" type="text" placeholder="Username" required
                             class="block w-full px-4 py-2 border border-gray-200 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div>
                <label for="password" class="sr-only">Password</label>
                <input id="password" name="password" type="password" placeholder="Password" required
                             class="block w-full px-4 py-2 border border-gray-200 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div class="flex items-center justify-between">
                <div class="text-sm">
                    <a href="/register" class="text-indigo-600 hover:underline">Create account</a>
                </div>
            </div>

            <div>
                <button type="submit" class="w-full py-2 px-4 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">Login</button>
            </div>
        </form>
    </div>
</body>
</html>
